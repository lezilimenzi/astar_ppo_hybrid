# px4_rl_offboard_mavros — RL Offboard Control (MAVROS ENU frame)

rl_offboard_node:
  ros__parameters:
    # Topics
    mavros_state_topic: "/mavros/state"
    mavros_odom_topic: "/mavros/local_position/odom"
    mavros_setpoint_topic: "/mavros/setpoint_velocity/cmd_vel_unstamped"  # ENU 속도
    scan_topic: "/scan"
    goal_topic: "/planner/goal"
    homing_done_topic: "/planner/homing_done"
    wait_for_homing: true

    odom_timeout_sec: 0.3   # 22Hz odom 기준 ~6× 여유
    scan_timeout_sec: 0.5   # 10Hz scan 기준 5× 여유
    goal_radius: 1.5        # 이내면 hover (overshoot 방지)

    # nav_mode: hybrid(A* lookahead + PPO) | astar(단독) | ppo(단독, 비교용)
    #   모델: hybrid→policy_hybrid_ts.pt, ppo→policy_ppo_ts.pt (+ 대응 obs_norm_*.json)
    nav_mode: "hybrid"
    grid_topic: "/local_grid"
    occ_threshold: 50
    allow_diag: true
    replan_period: 1.0      # A* 재계획 주기 (A* ~8ms/call, 독립 스레드)
    rl_front_deg: 90.0
    lidar_range_min_override: 0.35   # 자기감지(body/암 ~0.25m) 방어: 이 미만 반사 → max_range

    emergency_brake_dist: 0.0     # 0 = 비활성 (grid 회피로 충분)
    emergency_brake_deg: 30.0

    planner_max_yaw_rate: 1.0     # astar 전용 회전 상한. 모드 간 동일(ppo/hybrid는 max_yaw_rate=1.0)
    hybrid_lookahead_dist_m: 1.0  # 경로 lookahead 거리 (astar/hybrid wp 추종 + 비상제동 회전방향). 작을수록 코너 방향 정확

    # 경로 후처리 (LOS shortcut + B-spline)
    smooth_bspline_enabled: true
    smooth_bspline_s: 0.0             # 0 = 보간(경유점 통과)
    smooth_bspline_output_points: 50
    wp_advance_search_window: 10
    smooth_bspline_skip_if_few_wps: 4  # 3차 B-spline 제어점 하한. 이 미만이면 스무딩 생략
    shortcut_los_clearance_cells: 1   # astar_min_inflation_cells와 일치시킬 것
    astar_min_inflation_cells: 1      # × resolution = 경로-벽 여유. 좁은 통로는 r을 0까지 자동 감소.
                                      # 팽창은 여기 한 곳에서만 건다
                                      # (grid_fuser publish_dilation_cells=0 — 중첩 시 통로 폐쇄)

    # 고도 유지
    enable_altitude_hold: true
    altitude_hold_margin: 0.1
    altitude_hold_gain: 0.4      # vz = gain*(target−current), ±0.5 클립

    # OFFBOARD
    setpoint_rate_hz: 20.0       # ≥2Hz 필수 (권장 10~20)
    pre_setpoint_sec: 2.0

    policy_path: ""              # 비우면 nav_mode별 default (share/.../models/)
    obs_norm_path: ""

    # env_params (학습과 일치)
    obs_beams: 64
    max_range: 10.0
    world_size: 20.0
