course_goal_publisher:
  ros__parameters:
    frame_id: "odom"
    default_course: "R"              # R 또는 L
    spawn_enu: [0.0, 0.0, 0.83]      # odom 원점 = Gazebo 스폰 (sitl_run.sh)

    # 활성 좌표 (스폰 기준 ENU). 월드 변경 시 아래 레퍼런스에서 복사.
    home_xyz: [0.0, 8.0, 4.0]
    goal_R: [8.0, -8.2, 4.0]
    goal_L: [-8.0, -8.2, 4.0]

    # 월드별 레퍼런스 (cruise z=4.0):
    #   obstacle_course.world  (20×20):              home[0,8,4]  goal_R[8,-8.2,4]  goal_L[-8,-8.2,4]
    #   military_airfield.world(50×50, obstacle h=8): home[0,0,4]  goal_R[20,20,4]   goal_L[-18,-20,4]
    #   ※ military 은 시각 마커(start/goal disc) 사용 — 좌표 변경 시 world 파일의 마커 pose 도 함께 갱신.
